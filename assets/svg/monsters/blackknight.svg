<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 100" aria-label="Chevalier Noir">
  <!-- Crête du heaume -->
  <path d="M24 6 L32 0 L40 6 L38 10 L26 10 Z" fill="#6a4820"/>
  <!-- Heaume -->
  <rect x="16" y="6" width="32" height="28" rx="6" fill="#1e1e1e" stroke="#6a4820" stroke-width="1.5"/>
  <!-- Visière (fentes orangées) -->
  <rect x="20" y="18" width="8"  height="3" rx="1" fill="#c84010"/>
  <rect x="36" y="18" width="8"  height="3" rx="1" fill="#c84010"/>
  <!-- Grille nasale -->
  <line x1="32" y1="18" x2="32" y2="30" stroke="#6a4820" stroke-width="1"/>
  <line x1="24" y1="26" x2="40" y2="26" stroke="#6a4820" stroke-width="1"/>
  <line x1="24" y1="30" x2="40" y2="30" stroke="#6a4820" stroke-width="1"/>
  <!-- Cou (gorgerin) -->
  <rect x="24" y="34" width="16" height="6" rx="2" fill="#1e1e1e" stroke="#6a4820" stroke-width="1"/>
  <!-- Épaulières -->
  <ellipse cx="13" cy="40" rx="10" ry="7" fill="#1e1e1e" stroke="#6a4820" stroke-width="1.5"/>
  <ellipse cx="51" cy="40" rx="10" ry="7" fill="#1e1e1e" stroke="#6a4820" stroke-width="1.5"/>
  <!-- Reflet épaulières -->
  <ellipse cx="11" cy="37" rx="4" ry="2" fill="#3a3a3a" opacity="0.6"/>
  <ellipse cx="53" cy="37" rx="4" ry="2" fill="#3a3a3a" opacity="0.6"/>
  <!-- Cuirasse -->
  <path d="M18 40 L46 40 L48 72 L16 72 Z" fill="#1e1e1e" stroke="#6a4820" stroke-width="1.5"/>
  <!-- Reflet cuirasse -->
  <path d="M22 42 L42 42 L40 56 L24 56 Z" fill="#2e2e2e" opacity="0.5"/>
  <!-- Ligne centrale + nervures -->
  <line x1="32" y1="40" x2="32" y2="72" stroke="#6a4820" stroke-width="1.5"/>
  <line x1="20" y1="54" x2="44" y2="54" stroke="#6a4820" stroke-width="1"/>
  <line x1="20" y1="63" x2="44" y2="63" stroke="#6a4820" stroke-width="1"/>
  <!-- Brassards -->
  <rect x="6"  y="40" width="10" height="24" rx="4" fill="#1e1e1e" stroke="#6a4820" stroke-width="1"/>
  <rect x="48" y="40" width="10" height="24" rx="4" fill="#1e1e1e" stroke="#6a4820" stroke-width="1"/>
  <!-- Gantelets -->
  <rect x="7"  y="64" width="8" height="8" rx="2" fill="#2e2e2e" stroke="#6a4820" stroke-width="1"/>
  <rect x="49" y="64" width="8" height="8" rx="2" fill="#2e2e2e" stroke="#6a4820" stroke-width="1"/>
  <!-- Jupon d'acier -->
  <rect x="18" y="72" width="28" height="6" rx="2" fill="#1e1e1e" stroke="#6a4820" stroke-width="1"/>
  <!-- Jambières -->
  <rect x="18" y="78" width="12" height="22" rx="4" fill="#1e1e1e" stroke="#6a4820" stroke-width="1"/>
  <rect x="34" y="78" width="12" height="22" rx="4" fill="#1e1e1e" stroke="#6a4820" stroke-width="1"/>
  <!-- Reflets jambières -->
  <rect x="20" y="80" width="5" height="8" rx="2" fill="#2e2e2e" opacity="0.5"/>
  <rect x="36" y="80" width="5" height="8" rx="2" fill="#2e2e2e" opacity="0.5"/>
</svg>

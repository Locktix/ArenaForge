<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 100" aria-label="Démon">
  <!-- Cornes -->
  <path d="M18 22 L8  2  L22 18 Z" fill="#7a1a7a" stroke="#aa40aa" stroke-width="1"/>
  <path d="M46 22 L56 2  L42 18 Z" fill="#7a1a7a" stroke="#aa40aa" stroke-width="1"/>
  <!-- Lueur externe tête -->
  <ellipse cx="32" cy="30" rx="20" ry="22" fill="#4a0a4a" stroke="#aa40aa" stroke-width="1.5"/>
  <!-- Tête -->
  <ellipse cx="32" cy="30" rx="17" ry="18" fill="#3a0a3a"/>
  <!-- Sourcils menaçants -->
  <path d="M18 22 Q24 18 28 22" fill="none" stroke="#aa40aa" stroke-width="2" stroke-linecap="round"/>
  <path d="M36 22 Q40 18 46 22" fill="none" stroke="#aa40aa" stroke-width="2" stroke-linecap="round"/>
  <!-- Œil gauche -->
  <ellipse cx="24" cy="28" rx="5" ry="5" fill="#0a0010"/>
  <ellipse cx="24" cy="28" rx="3.5" ry="3.5" fill="#9000b0"/>
  <ellipse cx="24" cy="28" rx="1.8" ry="1.8" fill="#e060ff"/>
  <ellipse cx="24" cy="28" rx="10" ry="9" fill="none" stroke="#c040e0" stroke-width="0.8" opacity="0.4"/>
  <!-- Œil droit -->
  <ellipse cx="40" cy="28" rx="5" ry="5" fill="#0a0010"/>
  <ellipse cx="40" cy="28" rx="3.5" ry="3.5" fill="#9000b0"/>
  <ellipse cx="40" cy="28" rx="1.8" ry="1.8" fill="#e060ff"/>
  <ellipse cx="40" cy="28" rx="10" ry="9" fill="none" stroke="#c040e0" stroke-width="0.8" opacity="0.4"/>
  <!-- Sourire / mâchoire -->
  <path d="M22 40 Q32 48 42 40" fill="none" stroke="#aa40aa" stroke-width="1.5"/>
  <path d="M24 40 L22 46 M28 42 L27 48 M32 43 L32 49 M36 42 L37 48 M40 40 L42 46"
        stroke="#c060c0" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Corps (nébuleux, organique) -->
  <path d="M16 48 Q6 60 10 80 L18 76 Q16 62 22 56 Z" fill="#3a0a3a" stroke="#7a1a7a" stroke-width="1"/>
  <path d="M48 48 Q58 60 54 80 L46 76 Q48 62 42 56 Z" fill="#3a0a3a" stroke="#7a1a7a" stroke-width="1"/>
  <path d="M16 48 Q32 58 48 48 L52 80 Q32 92 12 80 Z" fill="#3a0a3a" stroke="#7a1a7a" stroke-width="1.2"/>
  <!-- Ailes (repliées) -->
  <path d="M14 50 Q2 44 0 56 Q4 64 14 60 Z" fill="#5a0a5a" stroke="#aa40aa" stroke-width="1" opacity="0.9"/>
  <path d="M50 50 Q62 44 64 56 Q60 64 50 60 Z" fill="#5a0a5a" stroke="#aa40aa" stroke-width="1" opacity="0.9"/>
  <!-- Griffes -->
  <path d="M12 78 L8 88 M16 80 L14 90 M20 81 L19 91" stroke="#aa40aa" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M52 78 L56 88 M48 80 L50 90 M44 81 L45 91" stroke="#aa40aa" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Halo central (poitrine pulsante) -->
  <ellipse cx="32" cy="66" rx="8" ry="6" fill="#5a005a" stroke="#c040e0" stroke-width="1" opacity="0.7"/>
  <ellipse cx="32" cy="66" rx="4" ry="3" fill="#e060ff" opacity="0.4"/>
</svg>

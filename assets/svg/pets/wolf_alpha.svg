<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-label="Loup Alpha">
  <g fill="#3a3a4a" stroke="#1a1410" stroke-width="1.5">
    <ellipse cx="36" cy="42" rx="22" ry="13"/>
    <circle cx="15" cy="27" r="13"/>
    <!-- tall pointed ears -->
    <path d="M6 20 L4 4 L18 19 Z"/>
    <path d="M22 20 L24 4 L30 19 Z"/>
    <path d="M56 36 L64 26 L60 48 Z"/>
    <rect x="21" y="50" width="5" height="12" rx="1.5"/>
    <rect x="43" y="50" width="5" height="12" rx="1.5"/>
  </g>
  <!-- inner ear gold -->
  <path d="M9 18 L8 8 L17 18 Z" fill="#c8a020"/>
  <path d="M22 18 L24 8 L29 18 Z" fill="#c8a020"/>
  <!-- glowing gold eyes -->
  <circle cx="11" cy="27" r="2.2" fill="#ffcc00"/>
  <circle cx="21" cy="27" r="2.2" fill="#ffcc00"/>
  <circle cx="11" cy="27" r="0.9" fill="#1a1410"/>
  <circle cx="21" cy="27" r="0.9" fill="#1a1410"/>
  <!-- muzzle markings -->
  <path d="M9 33 L15 37 L22 33 L18 35 Z" fill="#1a1410"/>
  <path d="M13 37 L12 41 M17 37 L18 41" stroke="#fff" stroke-width="1.2"/>
  <!-- alpha scar -->
  <path d="M10 22 L14 26" stroke="#ff6644" stroke-width="1.5" fill="none" stroke-linecap="round"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-label="Sphinx">
  <g fill="#1a0a28" stroke="#1a1410" stroke-width="1.5">
    <ellipse cx="36" cy="44" rx="22" ry="11"/>
    <circle cx="15" cy="28" r="12"/>
    <path d="M8 22 L6 10 L18 20 Z"/>
    <path d="M20 22 L22 10 L28 20 Z"/>
    <!-- flowing tail -->
    <path d="M56 40 C68 28 70 52 58 52" fill="#1a0a28"/>

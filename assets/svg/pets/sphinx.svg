  <path d="M6 34 C0 24 0 18 8 22 L14 34 Z" fill="#4a2060" stroke="#1a1410" stroke-width="1"/>
  <path d="M24 34 C30 24 30 18 22 22 L16 34 Z" fill="#4a2060" stroke="#1a1410" stroke-width="1"/>
  <!-- mystic eyes (violet) -->
  <circle cx="12" cy="28" r="1.8" fill="#cc44ff"/>
  <circle cx="20" cy="28" r="1.8" fill="#cc44ff"/>
  <circle cx="12" cy="28" r="0.7" fill="#1a1410"/>
  <circle cx="20" cy="28" r="0.7" fill="#1a1410"/>
  <!-- forehead gem -->
